<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TecnoStore | Registro</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <!--CONTENIDO PRINCIPAL-->
  <h1>Registro</h1>
  <form action="#" method="post">
    <label for="nombre">Nombre:</label><br>
    <input id="nombre" name="nombre" type="text" required><br><br>

    <label for="apellido">Apellido:</label><br>
    <input id="apellido" name="apellido" type="text" required><br><br>

    <label for="email">Email:</label><br>
    <input id="email" name="email" type="email" required><br><br>

    <label for="password">Contraseña:</label><br>
    <input id="password" name="password" type="password" required><br><br>

    <label for="fechaNacimiento">Fecha de nacimiento:</label><br>
    <input id="fechaNacimiento" name="fechaNacimiento" type="date" required><br><br>
    <!--BOTON REGISTRARSE-->
    <button type="submit">Registrarse</button>
  </form>
</body>
</html>
