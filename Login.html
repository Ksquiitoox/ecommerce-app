<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | TecnoStore</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!--NAVBAR-->
  <div id="navbar"></div>
  <!--CONTENIDO PRINCIPAL-->
  <div class="login-container">
    <h2>Iniciar Sesión</h2>
    <input type="text" id="nombre" placeholder="Nombre de usuario">
    <input type="password" id="password" placeholder="Contraseña">
    <button id="btnLogin" class="btn-login">Ingresar</button>
  </div>

  <script src="js/navbarData.js"></script>
  <script src="js/navbar.js"></script>
  <script>
    document.getElementById("btnLogin").addEventListener("click", () => {
      const nombre = document.getElementById("nombre").value.trim();
      const password = document.getElementById("password").value.trim();
      if (nombre === "" || password === "") {
        alert("Por favor completá todos los campos.");
        return;
      }
      const usuario = { nombre: nombre };
      localStorage.setItem("usuarioLogueado", JSON.stringify(usuario));
      alert(`Bienvenido ${nombre} 👋`);
      window.location.href = "index.html";
    });
  </script>

</body>
</html>
