<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - TecnoStore</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav id="navbar"></nav>

  <main class="form-container"> 
    <h2>Iniciar Sesión</h2>
    <form id="loginForm">
      <label for="email">Correo electrónico:</label>
      <input type="email" id="email" name="email" required>

      <label for="password">Contraseña:</label>
      <input type="password" id="password" name="password" required>

      <button type="submit">Ingresar</button>

      <p class="alt-link">
        ¿No tenés cuenta?
        <a href="register.html">Registrate aquí</a>
      </p>
    </form>
  </main>

  <footer style="background-color:#0f172a; color:white; text-align:center; padding:15px;">
    <p>© 2025 TecnoStore — Todos los derechos reservados</p>
  </footer>

  <script src="js/navbarData.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
