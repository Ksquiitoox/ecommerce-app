    <!-- CONTENIDO PRINCIPAL-->
    <main class="form-container"> 
        <h2>Iniciar Sesión</h2>
        <form action="#" method="post" class="form-box" id="loginForm">
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Ingresar</button>

            <p class="alt-link">¿No tenés cuenta? <a href="register.html">Registrate aquí</a></p>
        </form>
        <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            // Acá podrías validar usuario/contraseña si quisieras
            // window.location.href = "index.html"; // redirección al home
});
</script>
