<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro | TecnoStore</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!--NAVBAR-->
  <div id="navbar"></div>
  <!--CONTENIDO PRINCIPAL-->
  <div class="register-container">
    <h2>Crear Cuenta</h2>
    <input type="text" id="nombreRegistro" placeholder="Nombre de usuario">
    <input type="password" id="passwordRegistro" placeholder="Contraseña">
    <button id="btnRegistrar" class="btn-register">Registrarme</button>
  </div>

  <script src="js/navbarData.js"></script>
  <script src="js/navbar.js"></script>
  <script>
    document.getElementById("btnRegistrar").addEventListener("click", () => {
      const nombre = document.getElementById("nombreRegistro").value.trim();
      const password = document.getElementById("passwordRegistro").value.trim();
      if (nombre === "" || password === "") {
        alert("Completá todos los campos para registrarte.");
        return;
      }
      alert(`Usuario ${nombre} registrado correctamente ✅`);
      window.location.href = "Login.html";
    });
  </script>

</body>
</html>
