<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro | TecnoStore</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://kit.fontawesome.com/a2e0e6e6b3.js" crossorigin="anonymous"></script>
</head>
<body>

  <!-- NAVBAR -->
  <div id="navbar"></div>

  <!-- FORMULARIO DE REGISTRO -->
  <div class="form-container">
    <h2>Crear Cuenta</h2>
    <form id="RegisterForm" class="form-box">

      <div class="input-icon">
        <i class="fa-solid fa-user icon"></i>
        <input type="text" id="nombre" placeholder="Nombre" required>
      </div>

      <div class="input-icon">
        <i class="fa-solid fa-user icon"></i>
        <input type="text" id="apellido" placeholder="Apellido" required>
      </div>

      <div class="input-icon">
        <i class="fa-solid fa-envelope icon"></i>
        <input type="email" id="email" placeholder="Correo electrónico" required>
      </div>

      <div class="input-icon">
        <i class="fa-solid fa-lock icon"></i>
        <input type="password" id="password" placeholder="Contraseña" required>
      </div>

      <div class="input-icon">
        <i class="fa-solid fa-calendar-days icon"></i>
        <input type="date" id="fecha" required>
      </div>

      <button type="submit">Registrarse</button>

      <div class="alt-link">
        ¿Ya tenés cuenta? <a href="Login.html">Iniciá sesión</a>
      </div>
    </form>
  </div>

  <!-- SCRIPTS -->
  <script src="js/navbarData.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
