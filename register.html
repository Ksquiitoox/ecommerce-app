<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TecnoStore | Registro</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="login-container">
    <h2>Crear cuenta</h2>
    <form id="registerForm">
      <input type="text" id="nombre" placeholder="Nombre completo" required>
      <input type="email" id="email" placeholder="Correo electrónico" required>
      <input type="password" id="password" placeholder="Contraseña" required>
      <input type="password" id="confirmar" placeholder="Confirmar contraseña" required>
      <button type="submit">Registrarse</button>
    </form>

    <p style="margin-top:15px;">
      ¿Ya tenés cuenta?
      <a href="login.html" style="color:#38bdf8; text-decoration:none;">Iniciar sesión</a>
    </p>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const pass = document.getElementById('password').value;
      const confirm = document.getElementById('confirmar').value;

      if (pass !== confirm) {
        alert('Las contraseñas no coinciden');
        return;
      }

      alert('Registro exitoso ✅');
      window.location.href = 'login.html';
    });
  </script>

</body>
</html>
