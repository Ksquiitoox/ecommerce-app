<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - TecnoStore</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav id="navbar"></nav>

  <main class="form-container">
    <h2>Registro de Usuario</h2>
    <form id="registerForm" class="form-box">
      <div class="form-group">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" required placeholder="Ej: Juan"><br>
      </div>

      <div class="form-group">
      <label for="apellido">Apellido:</label>
      <input type="text" id="apellido" name="apellido" required placeholder="Ej: Gómez">
      </div>

      <div class="form-group">
      <label for="email">Correo electrónico:</label>
      <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group">
      <label for="password">Contraseña:</label>
      <input type="password" id="password" name="password" required>
      </div>
      
      <div class="form-group">
      <label for="fecha">Fecha de Nacimiento:</label>
      <input type="date" id="fecha" name="fecha" required>
      </div>

      <button type="submit">Registrarse</button>
      <p class="alt-link">¿Ya tenés cuenta? <a href="login.html">Iniciá sesión</a></p>
    </form>
  </main>

  <footer style="background-color:#0f172a; color:white; text-align:center; padding:15px;">
    <p>© 2025 TecnoStore — Todos los derechos reservados</p>
  </footer>

  <script src="js/navbarData.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
